name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/wroclaw-sky ./cmd/wroclaw-sky

      # Binary releases of golangci-lint are often built with an older Go than
      # go.mod's toolchain; install from source with the setup-go toolchain.
      - name: golangci-lint
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t wroclaw-sky .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: wroclaw-sky
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          scanners: vuln
          format: table
