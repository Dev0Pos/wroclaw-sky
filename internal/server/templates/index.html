<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>wroclaw-sky — live ADS-B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; min-height: 420px; }
    .plane-icon {
      background: transparent;
      border: none;
    }
    .plane-glyph {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
      display: block;
      transform-origin: 50% 50%;
    }
    .htmx-request #refresh-label { display: none; }
    .htmx-request #refresh-busy { display: inline !important; }
    /* Above Leaflet panes (~400–700) and iOS Safari chrome */
    #detail-panel {
      z-index: 5000;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    #detail-panel .detail-card {
      max-height: min(70vh, 520px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-full min-h-screen flex-col lg:flex-row">
    <aside class="flex w-full flex-col border-b border-slate-800 bg-slate-900/90 lg:w-96 lg:border-b-0 lg:border-r">
      <header class="border-b border-slate-800 px-5 py-4">
        <p class="text-xs uppercase tracking-[0.2em] text-sky-400/90">on demand · OpenSky</p>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight">wroclaw-sky</h1>
        <p class="mt-1 text-sm text-slate-400">Aircraft around Wrocław — refresh when you want</p>
        <button
          id="refresh-btn"
          type="button"
          class="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-md bg-sky-500 px-3 py-2 text-sm font-medium text-slate-950 hover:bg-sky-400 disabled:opacity-60"
          hx-post="/refresh"
          hx-target="#flights"
          hx-swap="innerHTML"
          hx-disabled-elt="this"
        >
          <span id="refresh-label">Refresh from OpenSky</span>
          <span id="refresh-busy" class="hidden">Refreshing…</span>
        </button>
      </header>

      <div id="flights" class="flex-1 overflow-y-auto">
        {{ template "flights.html" . }}
      </div>
    </aside>

    <main class="relative min-h-[50vh] flex-1">
      <div id="map" class="absolute inset-0"></div>
      <div class="pointer-events-none absolute left-3 top-3 z-[1000] rounded-md bg-slate-950/75 px-3 py-1.5 text-xs text-slate-300 backdrop-blur">
        EPWR · Wrocław bbox · tap a flight for route details
      </div>
    </main>
  </div>

  <!-- Fixed bottom sheet: visible on iPhone even when the list (not map) is on screen -->
  <div id="detail-panel" class="pointer-events-none fixed inset-x-0 bottom-0 hidden px-3 lg:inset-x-auto lg:right-3 lg:bottom-3 lg:w-full lg:max-w-md">
    <div class="detail-card pointer-events-auto mx-auto mb-3 rounded-xl border border-slate-700 bg-slate-950/95 p-4 shadow-2xl backdrop-blur lg:mx-0 lg:mb-0">
      <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-slate-700 lg:hidden" aria-hidden="true"></div>
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p id="detail-callsign" class="truncate text-lg font-semibold tracking-wide text-sky-200">—</p>
          <p id="detail-sub" class="truncate text-xs text-slate-500"></p>
        </div>
        <button type="button" id="detail-close" class="shrink-0 rounded-md px-3 py-2 text-base text-slate-400 hover:bg-slate-800 hover:text-slate-100" aria-label="Close">✕</button>
      </div>
      <div id="detail-route" class="mt-3 hidden rounded-md border border-sky-500/30 bg-sky-500/10 px-3 py-2">
        <p class="text-[10px] uppercase tracking-wider text-sky-400/90">Route</p>
        <p id="detail-route-line" class="mt-1 text-sm font-medium text-sky-100"></p>
        <p id="detail-route-names" class="mt-0.5 text-xs text-slate-400"></p>
      </div>
      <dl id="detail-grid" class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2 text-xs"></dl>
      <p id="detail-status" class="mt-3 hidden text-xs text-amber-200/90"></p>
    </div>
  </div>

  <script>
    const center = [{{ .CenterLat }}, {{ .CenterLon }}];
    const map = L.map('map', { zoomControl: true }).setView(center, 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19,
    }).addTo(map);

    L.circle([51.1027, 16.8858], {
      radius: 1200,
      color: '#38bdf8',
      weight: 1,
      fillOpacity: 0.08,
    }).addTo(map).bindTooltip('EPWR');

    const markers = new Map();
    const lastAircraft = new Map(); // icao24 -> last /api/aircraft row
    const panel = document.getElementById('detail-panel');
    const detailClose = document.getElementById('detail-close');

    function planeIcon(track, onGround) {
      const rot = Number(track) || 0;
      const color = onGround ? '#94a3b8' : '#7dd3fc';
      const html = `<span class="plane-glyph" style="transform:rotate(${rot}deg);color:${color}">✈</span>`;
      return L.divIcon({ className: 'plane-icon', html, iconSize: [24, 24], iconAnchor: [12, 12] });
    }

    function fmtAlt(m) {
      return m > 0 ? Math.round(m * 3.28084) + ' ft' : '—';
    }
    function fmtSpd(ms) {
      return ms > 0 ? Math.round(ms * 1.94384) + ' kt' : '—';
    }
    function fmtVs(ms) {
      if (ms == null || Number.isNaN(ms)) return '—';
      const fpm = Math.round(ms * 196.85);
      if (fpm === 0) return '0 fpm';
      return (fpm > 0 ? '+' : '') + fpm + ' fpm';
    }

    function setDetail(d, loading) {
      panel.classList.remove('hidden');
      document.getElementById('detail-callsign').textContent = d.callsign || d.icao24 || '—';
      const bits = [d.registration, d.icao24, d.country].filter(Boolean);
      document.getElementById('detail-sub').textContent = bits.join(' · ');

      const routeBox = document.getElementById('detail-route');
      if (d.origin || d.destination || d.route) {
        routeBox.classList.remove('hidden');
        const o = d.origin || '?';
        const dest = d.destination || '?';
        document.getElementById('detail-route-line').textContent = o + '  →  ' + dest;
        const on = d.origin_city || d.origin_name || '';
        const dn = d.dest_city || d.dest_name || '';
        document.getElementById('detail-route-names').textContent =
          (on || o) + (on || dn ? '  →  ' : '') + (dn || dest);
      } else {
        routeBox.classList.add('hidden');
      }

      const rows = [
        ['Type', [d.type_code, d.type_name].filter(Boolean).join(' · ') || '—'],
        ['Operator', d.operator || '—'],
        ['Altitude', fmtAlt(d.altitude_m)],
        ['Speed', fmtSpd(d.velocity)],
        ['Track', d.track != null ? Math.round(d.track) + '°' : '—'],
        ['Vertical', fmtVs(d.vertical)],
        ['Position', d.lat != null ? d.lat.toFixed(4) + ', ' + d.lon.toFixed(4) : '—'],
        ['Status', d.on_ground ? 'on ground' : 'airborne'],
      ];
      const grid = document.getElementById('detail-grid');
      grid.innerHTML = rows.map(([k, v]) =>
        `<div><dt class="text-slate-500">${k}</dt><dd class="text-slate-200">${v}</dd></div>`
      ).join('');

      const st = document.getElementById('detail-status');
      if (loading) {
        st.classList.remove('hidden');
        st.textContent = 'Loading route & aircraft info…';
      } else if (!d.origin && !d.destination && !d.registration && !d.type_name) {
        st.classList.remove('hidden');
        st.textContent = 'No published route/type found for this callsign (common for GA / military).';
      } else {
        st.classList.add('hidden');
      }
    }

    window.showAircraftDetail = async function showAircraftDetail(icao) {
      if (!icao) return;
      const cached = lastAircraft.get(icao) || { icao24: icao, callsign: icao };
      setDetail(cached, true);
      const m = markers.get(icao);
      if (m) {
        try { map.panTo(m.getLatLng()); } catch (_) {}
      }
      try {
        const res = await fetch('/api/aircraft/' + encodeURIComponent(icao));
        if (!res.ok) {
          setDetail(cached, false);
          document.getElementById('detail-status').classList.remove('hidden');
          document.getElementById('detail-status').textContent = 'Aircraft not in current snapshot — refresh first.';
          return;
        }
        const d = await res.json();
        setDetail(d, false);
      } catch (e) {
        console.warn(e);
        setDetail(cached, false);
        document.getElementById('detail-status').classList.remove('hidden');
        document.getElementById('detail-status').textContent = 'Failed to load details.';
      }
    };

    detailClose.addEventListener('click', (e) => {
      e.preventDefault();
      panel.classList.add('hidden');
    });

    // Event delegation — works after HTMX refresh and on iOS Safari.
    document.getElementById('flights').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-icao]');
      if (!btn) return;
      e.preventDefault();
      window.showAircraftDetail(btn.getAttribute('data-icao'));
    });

    function popupHtml(a) {
      const alt = fmtAlt(a.altitude_m);
      const spd = fmtSpd(a.velocity);
      return `<strong>${a.callsign || a.icao24}</strong><br/>` +
        `${a.country || ''}<br/>alt ${alt} · ${spd}<br/>` +
        `<span style="opacity:.7">${a.icao24}</span>`;
    }

    async function refreshMap() {
      try {
        const res = await fetch('/api/aircraft');
        const data = await res.json();
        const seen = new Set();
        lastAircraft.clear();
        (data.aircraft || []).forEach((a) => {
          if (a.lat == null || a.lon == null) return;
          seen.add(a.icao24);
          lastAircraft.set(a.icao24, a);
          const latlng = [a.lat, a.lon];
          let m = markers.get(a.icao24);
          if (!m) {
            m = L.marker(latlng, { icon: planeIcon(a.track, a.on_ground) }).addTo(map);
            m.on('click', () => window.showAircraftDetail(a.icao24));
            markers.set(a.icao24, m);
          } else {
            m.setLatLng(latlng);
            m.setIcon(planeIcon(a.track, a.on_ground));
          }
          m.bindPopup(popupHtml(a));
        });
        for (const [id, m] of markers.entries()) {
          if (!seen.has(id)) {
            map.removeLayer(m);
            markers.delete(id);
          }
        }
      } catch (e) {
        console.warn('map refresh failed', e);
      }
    }

    document.body.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail && e.detail.target && e.detail.target.id === 'flights') {
        refreshMap();
      }
    });
  </script>
</body>
</html>
