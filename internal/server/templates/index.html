<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>wroclaw-sky — live ADS-B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/leaflet.css" />
  <script src="/static/leaflet.js"></script>
  <style>
    #map { height: 100%; min-height: 420px; }
    .plane-icon {
      background: transparent;
      border: none;
    }
    .plane-glyph {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
      display: block;
      transform-origin: 50% 50%;
    }
    .plane-glyph.approach {
      font-size: 26px;
      filter: drop-shadow(0 0 6px rgba(251,191,36,.75));
    }
    .htmx-request #refresh-label { display: none; }
    .htmx-request #refresh-busy { display: inline !important; }
    #detail-panel {
      z-index: 5000;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    #detail-panel .detail-card {
      max-height: min(70vh, 520px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #playback {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
    #playback.playing {
      border-color: rgb(56 189 248 / 0.55);
    }
    aside label, aside select, aside input[type="search"] {
      min-height: 2.25rem;
    }
    @media (max-width: 1023px) {
      #playback {
        left: 0.5rem;
        right: 0.5rem;
        bottom: 0.5rem;
        font-size: 11px;
      }
      #playback-toggle, #playback-live {
        min-height: 2.25rem;
        min-width: 3.25rem;
        padding: 0.35rem 0.6rem;
      }
      aside .flex.flex-wrap.gap-2 > * {
        min-height: 2.35rem;
      }
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-full min-h-screen flex-col lg:flex-row">
    <aside class="flex w-full flex-col border-b border-slate-800 bg-slate-900/90 lg:w-96 lg:border-b-0 lg:border-r">
      <header class="border-b border-slate-800 px-5 py-4">
        <p id="mode-label" class="text-xs uppercase tracking-[0.2em] text-sky-400/90">on demand · OpenSky</p>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight">wroclaw-sky</h1>
        <p class="mt-1 text-sm text-slate-400">Aircraft around Wrocław — refresh when you want</p>
        <div class="mt-4 flex gap-2">
          <button
            id="refresh-btn"
            type="button"
            class="inline-flex flex-1 items-center justify-center gap-2 rounded-md bg-sky-500 px-3 py-2 text-sm font-medium text-slate-950 hover:bg-sky-400 disabled:opacity-60"
            hx-post="/refresh"
            hx-target="#flights"
            hx-swap="innerHTML"
            hx-disabled-elt="this"
          >
            <span id="refresh-label">Refresh</span>
            <span id="refresh-busy" class="hidden">Refreshing…</span>
          </button>
          <button
            id="live-btn"
            type="button"
            class="inline-flex items-center justify-center rounded-md border border-slate-600 px-3 py-2 text-sm font-medium text-slate-200 hover:border-sky-500/60 hover:text-sky-200"
            aria-pressed="false"
            title="Shared server poll every 45s — one OpenSky fetch for all Live viewers"
          >Live</button>
        </div>

        <div class="mt-3 space-y-2">
          <input
            id="filter-q"
            type="search"
            placeholder="Filter callsign / ICAO"
            autocomplete="off"
            value="{{ .View.Q }}"
            class="w-full rounded-md border border-slate-700 bg-slate-950/60 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:border-sky-500/60 focus:outline-none"
          />
          <div class="flex flex-wrap gap-2 text-xs">
            <label class="inline-flex cursor-pointer items-center gap-1.5 rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300">
              <input id="filter-airborne" type="checkbox" class="rounded border-slate-600 bg-slate-900 text-sky-500"{{ if .View.Airborne }} checked{{ end }} />
              Airborne only
            </label>
            <select id="filter-alt" class="rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300 focus:outline-none">
              <option value="any"{{ if eq .View.Alt "any" }} selected{{ end }}>Any altitude</option>
              <option value="low"{{ if eq .View.Alt "low" }} selected{{ end }}>&lt; 10k ft</option>
              <option value="mid"{{ if eq .View.Alt "mid" }} selected{{ end }}>10–25k ft</option>
              <option value="high"{{ if eq .View.Alt "high" }} selected{{ end }}>&gt; 25k ft</option>
            </select>
            <select id="filter-epwr" class="rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300 focus:outline-none" title="Requires route enrichment after Refresh">
              <option value="any"{{ if eq .View.EPWR "any" }} selected{{ end }}>Any route</option>
              <option value="to"{{ if eq .View.EPWR "to" }} selected{{ end }}>To {{ .Focus.ICAO }}</option>
              <option value="from"{{ if eq .View.EPWR "from" }} selected{{ end }}>From {{ .Focus.ICAO }}</option>
              <option value="either"{{ if eq .View.EPWR "either" }} selected{{ end }}>{{ .Focus.ICAO }} either</option>
            </select>
            <select id="filter-airline" class="rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300 focus:outline-none" title="Filter by airline (from callsign)">
              <option value="any"{{ if or (eq .View.Airline "") (eq .View.Airline "any") }} selected{{ end }}>Any airline</option>
              {{ range .Airlines }}
              <option value="{{ . }}"{{ if eq $.View.Airline . }} selected{{ end }}>{{ . }}</option>
              {{ end }}
            </select>
            <select id="sort-by" class="rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300 focus:outline-none" title="Sort flight list">
              <option value="callsign"{{ if eq .View.Sort "callsign" }} selected{{ end }}>Sort: callsign</option>
              <option value="alt"{{ if eq .View.Sort "alt" }} selected{{ end }}>Sort: altitude</option>
              <option value="speed"{{ if eq .View.Sort "speed" }} selected{{ end }}>Sort: speed</option>
              <option value="epwr"{{ if eq .View.Sort "epwr" }} selected{{ end }}>Sort: dist {{ .Focus.ICAO }}</option>
            </select>
            <label class="inline-flex cursor-pointer items-center gap-1.5 rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300" title="Keep map centred on the selected flight while Live">
              <input id="follow-sel" type="checkbox" class="rounded border-slate-600 bg-slate-900 text-sky-500"{{ if .View.Follow }} checked{{ end }} />
              Follow
            </label>
            <label class="inline-flex cursor-pointer items-center gap-1.5 rounded-md border border-slate-700 bg-slate-950/40 px-2.5 py-1.5 text-slate-300" title="Browser notification when a flight enters {{ .Focus.ICAO }} approach (&lt;40 km) during Live">
              <input id="alert-approach" type="checkbox" class="rounded border-slate-600 bg-slate-900 text-sky-500"{{ if .View.Alert }} checked{{ end }} />
              Approach alert
            </label>
          </div>
          <div class="flex flex-wrap gap-3 text-[10px] uppercase tracking-wide text-slate-500">
            <span class="inline-flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-[#4ade80]"></span> low</span>
            <span class="inline-flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-[#38bdf8]"></span> mid</span>
            <span class="inline-flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-[#c084fc]"></span> high</span>
            <span class="inline-flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-[#94a3b8]"></span> ground</span>
          </div>
        </div>
      </header>

      <div id="flights" class="flex-1 overflow-y-auto">
        {{ template "flights.html" . }}
      </div>

      <footer class="border-t border-slate-800 px-5 py-3 text-xs text-slate-500">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <a
            href="https://github.com/Dev0Pos/wroclaw-sky"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-1.5 text-slate-400 transition hover:text-sky-300"
          >
            <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>GitHub · Dev0Pos/wroclaw-sky</span>
          </a>
          <a
            href="https://github.com/Dev0Pos"
            target="_blank"
            rel="noopener noreferrer"
            class="text-slate-500 transition hover:text-slate-300"
          >@Dev0Pos</a>
        </div>
      </footer>
    </aside>

    <main class="relative min-h-[50vh] flex-1">
      <div id="map" class="absolute inset-0"></div>
      <div class="pointer-events-none absolute left-3 top-3 z-[1000] rounded-md bg-slate-950/75 px-3 py-1.5 text-xs text-slate-300 backdrop-blur">
        {{ .MapLabel }} · tap a flight for route details
      </div>
      <div id="playback" class="absolute bottom-3 left-3 right-3 z-[1000] mx-auto max-w-xl rounded-lg border border-slate-700 bg-slate-950/90 px-3 py-2 text-xs text-slate-300 backdrop-blur">
        <div class="mb-1.5 flex items-center justify-between gap-2">
          <span class="uppercase tracking-wider text-slate-500">Trail playback</span>
          <span id="playback-status" class="text-[10px] text-slate-500">Waiting for trail history…</span>
        </div>
        <div class="mb-1 flex items-center justify-between gap-2 text-[10px] text-slate-500">
          <span id="playback-range">—</span>
          <span id="playback-time" class="tabular-nums text-slate-400">—</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="playback-toggle" class="rounded border border-slate-600 px-2 py-1 text-slate-200 hover:border-sky-500/60 hover:text-sky-200" title="Play / pause trail history">Play</button>
          <input id="playback-scrub" type="range" min="0" max="0" value="0" class="w-full accent-sky-400" disabled />
          <button type="button" id="playback-live" class="rounded border border-slate-600 px-2 py-1 text-slate-200 hover:border-sky-500/60" title="Exit playback and show live positions">Now</button>
        </div>
        <label class="mt-1.5 inline-flex cursor-pointer items-center gap-1.5 text-[10px] text-slate-500">
          <input id="playback-selected" type="checkbox" class="rounded border-slate-600 bg-slate-900 text-sky-500" />
          Selected flight only
        </label>
      </div>
    </main>
  </div>

  <div id="detail-panel" class="pointer-events-none fixed inset-x-0 bottom-0 hidden px-3 lg:inset-x-auto lg:right-3 lg:bottom-3 lg:w-full lg:max-w-md">
    <div class="detail-card pointer-events-auto mx-auto mb-3 rounded-xl border border-slate-700 bg-slate-950/95 p-4 shadow-2xl backdrop-blur lg:mx-0 lg:mb-0">
      <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-slate-700 lg:hidden" aria-hidden="true"></div>
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p id="detail-callsign" class="truncate text-lg font-semibold tracking-wide text-sky-200">—</p>
          <p id="detail-sub" class="truncate text-xs text-slate-500"></p>
        </div>
        <div class="flex shrink-0 items-center gap-1">
          <button type="button" id="detail-share" class="rounded-md px-2.5 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-sky-200" title="Copy share link">Link</button>
          <button type="button" id="detail-close" class="rounded-md px-3 py-2 text-base text-slate-400 hover:bg-slate-800 hover:text-slate-100" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="detail-route" class="mt-3 hidden rounded-md border border-sky-500/30 bg-sky-500/10 px-3 py-2">
        <p class="text-[10px] uppercase tracking-wider text-sky-400/90">Route</p>
        <p id="detail-route-line" class="mt-1 text-sm font-medium text-sky-100"></p>
        <p id="detail-route-names" class="mt-0.5 text-xs text-slate-400"></p>
      </div>
      <div id="detail-photo-wrap" class="mt-3 hidden">
        <img id="detail-photo" alt="" class="h-24 w-full rounded-md object-cover object-center bg-slate-900" />
      </div>
      <dl id="detail-grid" class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2 text-xs"></dl>
      <p id="detail-status" class="mt-3 hidden text-xs text-amber-200/90"></p>
    </div>
  </div>

  <script>
    const LIVE_MS = 45000;
    const PREDICT_SEC = 120;
    const FOCUS = { icao: "{{ .Focus.ICAO }}", lat: {{ .Focus.Lat }}, lon: {{ .Focus.Lon }} };
    const center = [{{ .CenterLat }}, {{ .CenterLon }}];
    const map = L.map('map', { zoomControl: true }).setView(center, 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19,
    }).addTo(map);

    L.circle([FOCUS.lat, FOCUS.lon], {
      radius: 1200,
      color: '#38bdf8',
      weight: 1,
      fillOpacity: 0.08,
    }).addTo(map).bindTooltip(FOCUS.icao);

    const markers = new Map();
    const trailLayers = new Map();
    const predictLayers = new Map();
    const lastAircraft = new Map();
    let liveTimer = null;
    let liveBeat = null;
    let liveSource = null;
    let lastTrails = {};
    let playbackAt = 0;
    let playbackMin = 0;
    let playbackMax = 0;
    let playbackPlaying = false;
    let playbackTimer = null;
    let playbackActive = false;
    const playbackMarkers = new Map();
    const playbackToggle = document.getElementById('playback-toggle');
    const playbackScrub = document.getElementById('playback-scrub');
    const playbackTime = document.getElementById('playback-time');
    const playbackLiveBtn = document.getElementById('playback-live');
    const playbackStatus = document.getElementById('playback-status');
    const playbackRange = document.getElementById('playback-range');
    const playbackSelected = document.getElementById('playback-selected');
    const playbackRoot = document.getElementById('playback');
    let selectedIcao = null;
    const panel = document.getElementById('detail-panel');
    const detailClose = document.getElementById('detail-close');
    const detailShare = document.getElementById('detail-share');
    const liveBtn = document.getElementById('live-btn');
    const modeLabel = document.getElementById('mode-label');
    const filterQ = document.getElementById('filter-q');
    const filterAirborne = document.getElementById('filter-airborne');
    const filterAlt = document.getElementById('filter-alt');
    const filterEpwr = document.getElementById('filter-epwr');
    const filterAirline = document.getElementById('filter-airline');
    const sortBy = document.getElementById('sort-by');
    const followSel = document.getElementById('follow-sel');
    const alertApproach = document.getElementById('alert-approach');
    const bootLive = {{ if .View.Live }}true{{ else }}false{{ end }};
    const bootIcao = {{ if .View.ICAO }}"{{ .View.ICAO }}"{{ else }}""{{ end }};
    let approachSeen = new Map();
    let approachBootstrapped = false;

    function altColor(altM, onGround) {
      if (onGround) return '#94a3b8';
      const ft = (Number(altM) || 0) * 3.28084;
      if (ft <= 0) return '#7dd3fc';
      if (ft < 10000) return '#4ade80';
      if (ft < 25000) return '#38bdf8';
      return '#c084fc';
    }

    function planeIcon(track, altM, onGround, approach) {
      const rot = Number(track) || 0;
      const color = approach ? '#fbbf24' : altColor(altM, onGround);
      const cls = approach ? 'plane-glyph approach' : 'plane-glyph';
      const html = `<span class="${cls}" style="transform:rotate(${rot}deg);color:${color}">✈</span>`;
      return L.divIcon({ className: 'plane-icon', html, iconSize: [28, 28], iconAnchor: [14, 14] });
    }

    function fmtAlt(m) {
      return m > 0 ? Math.round(m * 3.28084) + ' ft' : '—';
    }
    function fmtSpd(ms) {
      return ms > 0 ? Math.round(ms * 1.94384) + ' kt' : '—';
    }
    function fmtVs(ms) {
      if (ms == null || Number.isNaN(ms)) return '—';
      const fpm = Math.round(ms * 196.85);
      if (fpm === 0) return '0 fpm';
      return (fpm > 0 ? '+' : '') + fpm + ' fpm';
    }

    function haversineM(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => d * Math.PI / 180;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
      const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function destinationPoint(lat, lon, bearingDeg, distM) {
      const R = 6371000;
      const δ = distM / R;
      const θ = bearingDeg * Math.PI / 180;
      const φ1 = lat * Math.PI / 180;
      const λ1 = lon * Math.PI / 180;
      const sinφ2 = Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ);
      const φ2 = Math.asin(sinφ2);
      const λ2 = λ1 + Math.atan2(
        Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
        Math.cos(δ) - Math.sin(φ1) * sinφ2
      );
      return [φ2 * 180 / Math.PI, ((λ2 * 180 / Math.PI) + 540) % 360 - 180];
    }

    function fmtDistKm(m) {
      if (!(m > 0)) return '—';
      const km = m / 1000;
      if (km < 10) return km.toFixed(1) + ' km';
      return Math.round(km) + ' km';
    }

    function fmtETA(sec) {
      if (!(sec > 0)) return '';
      if (sec < 60) return '~' + sec + 's';
      const m = Math.round(sec / 60);
      if (m < 60) return '~' + m + 'm';
      const h = Math.floor(m / 60);
      const rm = m % 60;
      return rm ? '~' + h + 'h ' + rm + 'm' : '~' + h + 'h';
    }

    function focusMetrics(a) {
      if (!a || a.lat == null || a.lon == null) return null;
      const dist = haversineM(a.lat, a.lon, FOCUS.lat, FOCUS.lon);
      const vel = Number(a.velocity) || 0;
      const etaSec = (!a.on_ground && vel >= 5) ? Math.round(dist / vel) : 0;
      return { dist, etaSec, inbound: (a.destination || '').toUpperCase() === FOCUS.icao };
    }

    function matchesFilters(a) {
      const q = (filterQ.value || '').trim().toLowerCase();
      if (q) {
        const cs = (a.callsign || '').toLowerCase();
        const icao = (a.icao24 || '').toLowerCase();
        if (!cs.includes(q) && !icao.includes(q)) return false;
      }
      if (filterAirborne.checked && a.on_ground) return false;
      const band = filterAlt.value;
      if (band !== 'any') {
        if (a.on_ground) return false;
        const ft = (Number(a.altitude_m) || 0) * 3.28084;
        if (band === 'low' && !(ft > 0 && ft < 10000)) return false;
        if (band === 'mid' && !(ft >= 10000 && ft <= 25000)) return false;
        if (band === 'high' && !(ft > 25000)) return false;
      }
      const epwr = filterEpwr.value;
      if (epwr !== 'any') {
        const o = (a.origin || '').toUpperCase();
        const d = (a.destination || '').toUpperCase();
        if (!o && !d) return false;
        const to = d === FOCUS.icao;
        const from = o === FOCUS.icao;
        if (epwr === 'to' && !to) return false;
        if (epwr === 'from' && !from) return false;
        if (epwr === 'either' && !to && !from) return false;
      }
      const airline = (filterAirline && filterAirline.value) || 'any';
      if (airline !== 'any') {
        if ((a.airline || '') !== airline) return false;
      }
      return true;
    }

    function setLayerVisible(layer, ok) {
      if (!layer) return;
      if (ok) {
        if (!map.hasLayer(layer)) layer.addTo(map);
      } else if (map.hasLayer(layer)) {
        map.removeLayer(layer);
      }
    }

    function applyListFilter() {
      const items = document.querySelectorAll('.flight-item');
      let shown = 0;
      items.forEach((el) => {
        const a = {
          icao24: el.getAttribute('data-icao') || '',
          callsign: el.getAttribute('data-callsign') || '',
          altitude_m: Number(el.getAttribute('data-alt') || 0),
          on_ground: el.getAttribute('data-onground') === '1',
          origin: el.getAttribute('data-origin') || '',
          destination: el.getAttribute('data-dest') || '',
          airline: el.getAttribute('data-airline') || '',
        };
        const ok = matchesFilters(a);
        el.classList.toggle('hidden', !ok);
        if (ok) shown++;
      });
      const total = items.length;
      const tip = document.getElementById('stat-filtered');
      if (tip) {
        if (shown < total) {
          tip.classList.remove('hidden');
          tip.textContent = ' · ' + shown + ' shown';
        } else {
          tip.classList.add('hidden');
          tip.textContent = '';
        }
      }
      for (const [icao, m] of markers.entries()) {
        const a = lastAircraft.get(icao);
        const ok = a ? matchesFilters(a) : true;
        setLayerVisible(m, ok);
        setLayerVisible(trailLayers.get(icao), ok);
        setLayerVisible(predictLayers.get(icao), ok);
      }
      applySort();
    }

    function sortValue(el, mode) {
      if (mode === 'alt') return Number(el.getAttribute('data-alt') || 0);
      if (mode === 'speed') return Number(el.getAttribute('data-vel') || 0);
      if (mode === 'epwr') {
        const lat = Number(el.getAttribute('data-lat') || 0);
        const lon = Number(el.getAttribute('data-lon') || 0);
        if (!lat && !lon) return Number.POSITIVE_INFINITY;
        return haversineM(lat, lon, FOCUS.lat, FOCUS.lon);
      }
      return (el.getAttribute('data-callsign') || el.getAttribute('data-icao') || '').toLowerCase();
    }

    function applySort() {
      const list = document.getElementById('flight-list');
      if (!list || !sortBy) return;
      const mode = sortBy.value || 'callsign';
      const items = Array.from(list.querySelectorAll('.flight-item'));
      items.sort((a, b) => {
        const va = sortValue(a, mode);
        const vb = sortValue(b, mode);
        if (typeof va === 'string' && typeof vb === 'string') {
          return va < vb ? -1 : va > vb ? 1 : 0;
        }
        // Higher alt/speed first; nearer focus first.
        if (mode === 'epwr') return va - vb;
        return vb - va;
      });
      items.forEach((el) => list.appendChild(el));
    }

    function syncViewURL(icao) {
      try {
        const u = new URL(location.href);
        const setOrDel = (k, v, defEmpty) => {
          if (v && v !== defEmpty) u.searchParams.set(k, v);
          else u.searchParams.delete(k);
        };
        setOrDel('q', (filterQ.value || '').trim(), '');
        if (filterAirborne.checked) u.searchParams.set('airborne', '1');
        else u.searchParams.delete('airborne');
        setOrDel('alt', filterAlt.value, 'any');
        setOrDel('epwr', filterEpwr.value, 'any');
        setOrDel('airline', filterAirline ? filterAirline.value : 'any', 'any');
        setOrDel('sort', sortBy.value, 'callsign');
        if (liveBtn.getAttribute('aria-pressed') === 'true') u.searchParams.set('live', '1');
        else u.searchParams.delete('live');
        if (!followSel.checked) u.searchParams.set('follow', '0');
        else u.searchParams.delete('follow');
        if (alertApproach && alertApproach.checked) u.searchParams.set('alert', '1');
        else u.searchParams.delete('alert');
        const id = icao !== undefined ? icao : selectedIcao;
        if (id) u.searchParams.set('icao', id);
        else u.searchParams.delete('icao');
        history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (_) {}
    }

    function setShareIcao(icao) {
      syncViewURL(icao);
    }

    function newlyOnApproach(prev, curr) {
      const out = [];
      for (const [id, on] of curr.entries()) {
        if (on && !prev.get(id)) out.push(id);
      }
      out.sort();
      return out;
    }

    async function maybeNotifyApproaches(curr) {
      if (!alertApproach || !alertApproach.checked) {
        approachSeen = curr;
        approachBootstrapped = true;
        return;
      }
      if (!approachBootstrapped) {
        approachSeen = curr;
        approachBootstrapped = true;
        return;
      }
      const fresh = newlyOnApproach(approachSeen, curr);
      approachSeen = curr;
      if (!fresh.length) return;
      if (typeof Notification === 'undefined') return;
      try {
        if (Notification.permission === 'default') {
          await Notification.requestPermission();
        }
        if (Notification.permission !== 'granted') return;
        for (const id of fresh) {
          const a = lastAircraft.get(id) || {};
          const title = (a.callsign || id) + ' on ' + FOCUS.icao + ' approach';
          const body = (a.origin || '?') + ' → ' + FOCUS.icao;
          new Notification(title, { body, tag: 'approach-' + id });
        }
      } catch (_) {}
    }

    function setDetail(d, loading) {
      panel.classList.remove('hidden');
      document.querySelectorAll('.flight-row').forEach((el) => {
        el.classList.toggle('ring-1', el.getAttribute('data-icao') === d.icao24);
        el.classList.toggle('ring-sky-500/60', el.getAttribute('data-icao') === d.icao24);
        el.classList.toggle('bg-slate-800/80', el.getAttribute('data-icao') === d.icao24);
      });
      document.getElementById('detail-callsign').textContent = d.callsign || d.icao24 || '—';
      const bits = [d.registration, d.icao24, d.country].filter(Boolean);
      document.getElementById('detail-sub').textContent = bits.join(' · ');

      const routeBox = document.getElementById('detail-route');
      if (d.origin || d.destination || d.route) {
        routeBox.classList.remove('hidden');
        const o = d.origin || '?';
        const dest = d.destination || '?';
        document.getElementById('detail-route-line').textContent = o + '  →  ' + dest;
        const on = d.origin_city || d.origin_name || '';
        const dn = d.dest_city || d.dest_name || '';
        document.getElementById('detail-route-names').textContent =
          (on || o) + (on || dn ? '  →  ' : '') + (dn || dest);
      } else {
        routeBox.classList.add('hidden');
      }

      const photoWrap = document.getElementById('detail-photo-wrap');
      const photo = document.getElementById('detail-photo');
      if (d.photo_url) {
        photo.src = d.photo_url;
        photo.alt = d.registration || d.callsign || 'Aircraft';
        photoWrap.classList.remove('hidden');
      } else {
        photo.removeAttribute('src');
        photoWrap.classList.add('hidden');
      }

      const metrics = focusMetrics(d);
      const rows = [
        ['Type', [d.type_code, d.type_name].filter(Boolean).join(' · ') || '—'],
        ['Operator', d.operator || '—'],
        ['Altitude', fmtAlt(d.altitude_m)],
        ['Speed', fmtSpd(d.velocity)],
        ['Track', d.track != null ? Math.round(d.track) + '°' : '—'],
        ['Vertical', fmtVs(d.vertical)],
        ['Position', d.lat != null ? d.lat.toFixed(4) + ', ' + d.lon.toFixed(4) : '—'],
        ['Status', d.on_ground ? 'on ground' : 'airborne'],
      ];
      if (metrics) {
        rows.push(['To ' + FOCUS.icao, fmtDistKm(metrics.dist)]);
        if (metrics.etaSec > 0) {
          const label = metrics.inbound ? 'ETA ' + FOCUS.icao : 'ETA (straight)';
          rows.push([label, fmtETA(metrics.etaSec)]);
        }
      }
      const grid = document.getElementById('detail-grid');
      grid.innerHTML = rows.map(([k, v]) =>
        `<div><dt class="text-slate-500">${k}</dt><dd class="text-slate-200">${v}</dd></div>`
      ).join('');

      const st = document.getElementById('detail-status');
      if (loading) {
        st.classList.remove('hidden');
        st.textContent = 'Looking up route…';
      } else if (d.origin || d.destination || d.route) {
        st.classList.add('hidden');
      } else if (d.registration || d.type_name) {
        st.classList.remove('hidden');
        st.textContent = 'No published route for this callsign.';
      } else {
        st.classList.remove('hidden');
        st.textContent = 'No route/type in database (common for GA / military).';
      }
    }

    function maybeFollow(icao) {
      if (!icao || !followSel.checked) return;
      if (panel.classList.contains('hidden')) return;
      const m = markers.get(icao);
      if (!m) return;
      try { map.panTo(m.getLatLng()); } catch (_) {}
    }

    window.showAircraftDetail = async function showAircraftDetail(icao) {
      if (!icao) return;
      selectedIcao = icao;
      setShareIcao(icao);
      const cached = lastAircraft.get(icao) || { icao24: icao, callsign: icao };
      setDetail(cached, true);
      maybeFollow(icao);
      try {
        const res = await fetch('/api/aircraft/' + encodeURIComponent(icao));
        if (!res.ok) {
          setDetail(cached, false);
          document.getElementById('detail-status').classList.remove('hidden');
          document.getElementById('detail-status').textContent = 'Aircraft not in current snapshot — refresh first.';
          return;
        }
        const d = await res.json();
        setDetail(d, false);
      } catch (e) {
        console.warn(e);
        setDetail(cached, false);
        document.getElementById('detail-status').classList.remove('hidden');
        document.getElementById('detail-status').textContent = 'Failed to load details.';
      }
    };

    detailClose.addEventListener('click', (e) => {
      e.preventDefault();
      panel.classList.add('hidden');
      selectedIcao = null;
      setShareIcao(null);
      document.querySelectorAll('.flight-row').forEach((el) => {
        el.classList.remove('ring-1', 'ring-sky-500/60', 'bg-slate-800/80');
      });
    });

    detailShare.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!selectedIcao) return;
      syncViewURL(selectedIcao);
      const url = location.origin + location.pathname + location.search;
      try {
        await navigator.clipboard.writeText(url);
        detailShare.textContent = 'Copied';
        setTimeout(() => { detailShare.textContent = 'Link'; }, 1200);
      } catch (_) {
        detailShare.textContent = 'Link';
      }
    });

    document.getElementById('flights').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-icao]');
      if (!btn) return;
      e.preventDefault();
      window.showAircraftDetail(btn.getAttribute('data-icao'));
    });

    function popupHtml(a) {
      const alt = fmtAlt(a.altitude_m);
      const spd = fmtSpd(a.velocity);
      let route = '';
      if (a.origin || a.destination) {
        route = `<br/><span style="opacity:.85">${a.origin || '?'} → ${a.destination || '?'}</span>`;
      }
      const m = focusMetrics(a);
      let epwr = '';
      if (m) {
        epwr = `<br/>${FOCUS.icao} ${fmtDistKm(m.dist)}`;
        if (m.etaSec > 0) epwr += ' · ' + fmtETA(m.etaSec);
      }
      return `<strong>${a.callsign || a.icao24}</strong><br/>` +
        `${a.country || ''}<br/>alt ${alt} · ${spd}` + route + epwr + `<br/>` +
        `<span style="opacity:.7">${a.icao24}</span>`;
    }

    function clearLayerMap(mapRef, icao) {
      const old = mapRef.get(icao);
      if (old) {
        map.removeLayer(old);
        mapRef.delete(icao);
      }
    }

    function upsertTrail(icao, pts, color, inbound, approach) {
      if (!pts || pts.length < 2) {
        clearLayerMap(trailLayers, icao);
        return;
      }
      const latlngs = pts.map((p) => [p.lat, p.lon]);
      let layer = trailLayers.get(icao);
      const style = {
        color: (inbound || approach) ? '#fbbf24' : (color || '#38bdf8'),
        weight: approach ? 4 : inbound ? 3 : 2,
        opacity: approach ? 0.9 : inbound ? 0.75 : 0.55,
        interactive: false,
      };
      if (!layer) {
        layer = L.polyline(latlngs, style).addTo(map);
        trailLayers.set(icao, layer);
      } else {
        layer.setLatLngs(latlngs);
        layer.setStyle(style);
      }
    }

    function upsertPredict(icao, a, color) {
      const vel = Number(a.velocity) || 0;
      const track = Number(a.track);
      if (a.on_ground || vel < 15 || Number.isNaN(track)) {
        clearLayerMap(predictLayers, icao);
        return;
      }
      const end = destinationPoint(a.lat, a.lon, track, vel * PREDICT_SEC);
      const latlngs = [[a.lat, a.lon], end];
      const inbound = (a.destination || '').toUpperCase() === FOCUS.icao;
      const approach = inbound && !a.on_ground &&
        haversineM(a.lat, a.lon, FOCUS.lat, FOCUS.lon) <= 40000;
      const style = {
        color: (inbound || approach) ? '#fbbf24' : (color || '#38bdf8'),
        weight: approach ? 3 : 2,
        opacity: approach ? 0.7 : 0.45,
        dashArray: '6 8',
        interactive: false,
      };
      let layer = predictLayers.get(icao);
      if (!layer) {
        layer = L.polyline(latlngs, style).addTo(map);
        predictLayers.set(icao, layer);
      } else {
        layer.setLatLngs(latlngs);
        layer.setStyle(style);
      }
    }

    function applyAircraftData(data) {
      if (!data) return;
      const seen = new Set();
      lastAircraft.clear();
      const trails = data.trails || {};
      lastTrails = trails;
      updatePlaybackRange(trails);
      if (playbackActive) {
        renderPlaybackFrame(playbackAt);
        return;
      }
      const approachNow = new Map();
      (data.aircraft || []).forEach((a) => {
          if (a.lat == null || a.lon == null) return;
          seen.add(a.icao24);
          lastAircraft.set(a.icao24, a);
          const color = altColor(a.altitude_m, a.on_ground);
          const inbound = (a.destination || '').toUpperCase() === FOCUS.icao;
          const approach = inbound && !a.on_ground &&
            haversineM(a.lat, a.lon, FOCUS.lat, FOCUS.lon) <= 40000;
          approachNow.set(a.icao24, !!approach);
          const latlng = [a.lat, a.lon];
          let m = markers.get(a.icao24);
          if (!m) {
            m = L.marker(latlng, { icon: planeIcon(a.track, a.altitude_m, a.on_ground, approach) }).addTo(map);
            m.on('click', () => window.showAircraftDetail(a.icao24));
            markers.set(a.icao24, m);
          } else {
            m.setLatLng(latlng);
            m.setIcon(planeIcon(a.track, a.altitude_m, a.on_ground, approach));
          }
          m.bindPopup(popupHtml(a));
          upsertTrail(a.icao24, trails[a.icao24], color, inbound, approach);
          upsertPredict(a.icao24, a, color);
      });
      for (const [id, m] of markers.entries()) {
        if (!seen.has(id)) {
          map.removeLayer(m);
          markers.delete(id);
          clearLayerMap(trailLayers, id);
          clearLayerMap(predictLayers, id);
        }
      }
      applyListFilter();
      maybeNotifyApproaches(approachNow);
      if (selectedIcao && liveBtn.getAttribute('aria-pressed') === 'true') {
        maybeFollow(selectedIcao);
      }
    }

    async function refreshMap() {
      try {
        const res = await fetch('/api/aircraft');
        const data = await res.json();
        applyAircraftData(data);
      } catch (e) {
        console.warn('map refresh failed', e);
      }
    }

    async function touchLive() {
      try {
        await fetch('/api/live', { method: 'POST' });
      } catch (e) {
        console.warn('live heartbeat failed', e);
      }
    }

    function trailTimeRange(trails) {
      let min = 0, max = 0, first = true;
      Object.values(trails || {}).forEach((pts) => {
        (pts || []).forEach((p) => {
          if (!p.at) return;
          if (first) { min = max = p.at; first = false; return; }
          if (p.at < min) min = p.at;
          if (p.at > max) max = p.at;
        });
      });
      return { min, max };
    }

    function positionAt(pts, at) {
      if (!pts || !pts.length) return null;
      if (pts.length === 1 || at <= pts[0].at) {
        if (at < pts[0].at && pts.length > 1) return null;
        return [pts[0].lat, pts[0].lon];
      }
      const last = pts[pts.length - 1];
      if (at >= last.at) return [last.lat, last.lon];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        if (at > b.at) continue;
        if (b.at === a.at) return [b.lat, b.lon];
        const t = (at - a.at) / (b.at - a.at);
        return [a.lat + (b.lat - a.lat) * t, a.lon + (b.lon - a.lon) * t];
      }
      return [last.lat, last.lon];
    }

    function fmtClock(at) {
      if (!at) return '—';
      try {
        return new Date(at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) { return String(at); }
    }

    function updatePlaybackRange(trails) {
      const r = trailTimeRange(trails);
      playbackMin = r.min;
      playbackMax = r.max;
      if (!playbackScrub) return;
      if (!playbackMin || !playbackMax || playbackMax <= playbackMin) {
        playbackScrub.disabled = true;
        playbackScrub.max = 0;
        if (playbackTime) playbackTime.textContent = '—';
        if (playbackRange) playbackRange.textContent = '—';
        if (playbackStatus) {
          playbackStatus.textContent = 'Need 2+ Live/Refresh ticks to unlock';
        }
        return;
      }
      playbackScrub.disabled = false;
      playbackScrub.min = String(playbackMin);
      playbackScrub.max = String(playbackMax);
      if (!playbackActive || playbackAt < playbackMin || playbackAt > playbackMax) {
        playbackAt = playbackMax;
      }
      playbackScrub.value = String(playbackAt);
      if (playbackTime) playbackTime.textContent = fmtClock(playbackAt);
      if (playbackRange) playbackRange.textContent = fmtClock(playbackMin) + ' → ' + fmtClock(playbackMax);
      if (playbackStatus) {
        playbackStatus.textContent = playbackActive
          ? (playbackPlaying ? 'Playing history' : 'Scrubbing history')
          : 'Ready — Play or drag the scrubber';
      }
    }

    function clearPlaybackMarkers() {
      for (const [, m] of playbackMarkers) map.removeLayer(m);
      playbackMarkers.clear();
    }

    function setPlaybackMode(on) {
      playbackActive = on;
      if (playbackRoot) playbackRoot.classList.toggle('playing', on);
      if (!on) {
        if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; }
        playbackPlaying = false;
        if (playbackToggle) playbackToggle.textContent = 'Play';
        clearPlaybackMarkers();
        for (const [, m] of markers) {
          if (!map.hasLayer(m)) m.addTo(map);
        }
        if (playbackStatus) playbackStatus.textContent = 'Live positions';
        refreshMap();
        return;
      }
      for (const [, m] of markers) {
        if (map.hasLayer(m)) map.removeLayer(m);
      }
      if (playbackStatus) playbackStatus.textContent = 'Scrubbing history';
      renderPlaybackFrame(playbackAt || playbackMax);
    }

    function renderPlaybackFrame(at) {
      playbackAt = at;
      if (playbackScrub && !playbackScrub.disabled) playbackScrub.value = String(at);
      if (playbackTime) playbackTime.textContent = fmtClock(at);
      const onlySel = playbackSelected && playbackSelected.checked;
      const seen = new Set();
      Object.keys(lastTrails || {}).forEach((icao) => {
        if (onlySel && selectedIcao && icao !== selectedIcao) return;
        const pos = positionAt(lastTrails[icao], at);
        if (!pos) return;
        seen.add(icao);
        let m = playbackMarkers.get(icao);
        const icon = planeIcon(0, 0, false, false);
        if (!m) {
          m = L.marker(pos, { icon, opacity: 0.85 }).addTo(map);
          m.on('click', () => window.showAircraftDetail(icao));
          playbackMarkers.set(icao, m);
        } else {
          m.setLatLng(pos);
        }
      });
      for (const [id, m] of playbackMarkers) {
        if (!seen.has(id)) {
          map.removeLayer(m);
          playbackMarkers.delete(id);
        }
      }
    }

    function togglePlayback() {
      if (!playbackMin || playbackMax <= playbackMin) return;
      if (!playbackActive) setPlaybackMode(true);
      playbackPlaying = !playbackPlaying;
      if (playbackToggle) playbackToggle.textContent = playbackPlaying ? 'Pause' : 'Play';
      if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; }
      if (playbackPlaying) {
        playbackTimer = setInterval(() => {
          let next = playbackAt + 2;
          if (next > playbackMax) next = playbackMin;
          renderPlaybackFrame(next);
        }, 200);
      }
    }

    if (playbackToggle) playbackToggle.addEventListener('click', togglePlayback);
    if (playbackScrub) playbackScrub.addEventListener('input', () => {
      if (!playbackActive) setPlaybackMode(true);
      playbackPlaying = false;
      if (playbackToggle) playbackToggle.textContent = 'Play';
      if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; }
      renderPlaybackFrame(Number(playbackScrub.value));
    });
    if (playbackLiveBtn) playbackLiveBtn.addEventListener('click', () => setPlaybackMode(false));
    if (playbackSelected) playbackSelected.addEventListener('change', () => {
      if (playbackActive) renderPlaybackFrame(playbackAt);
    });

    function closeLiveSource() {
      if (liveSource) {
        try { liveSource.close(); } catch (_) {}
        liveSource = null;
      }
    }

    function openLiveSource() {
      closeLiveSource();
      if (typeof EventSource === 'undefined') return;
      try {
        liveSource = new EventSource('/api/events');
        liveSource.addEventListener('update', (ev) => {
          if (playbackActive) return;
          try {
            const data = JSON.parse(ev.data || '{}');
            if (data.aircraft) applyAircraftData(data);
          } catch (_) {}
          swapFlights();
        });
        liveSource.onerror = () => {
          // Browser reconnects automatically; fall back poll if stream dies hard.
        };
      } catch (e) {
        console.warn('SSE failed', e);
      }
    }

    function swapFlights() {
      htmx.ajax('GET', '/flights', { target: '#flights', swap: 'innerHTML' });
    }

    async function setLive(on) {
      try { localStorage.setItem('wroclaw-sky-live', on ? '1' : '0'); } catch (_) {}
      liveBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      liveBtn.classList.toggle('border-sky-500', on);
      liveBtn.classList.toggle('bg-sky-500/15', on);
      liveBtn.classList.toggle('text-sky-200', on);
      modeLabel.textContent = on ? 'live · SSE + shared poll' : 'on demand · OpenSky';
      if (liveTimer) {
        clearInterval(liveTimer);
        liveTimer = null;
      }
      if (liveBeat) {
        clearInterval(liveBeat);
        liveBeat = null;
      }
      closeLiveSource();
      if (on) {
        await touchLive();
        swapFlights();
        openLiveSource();
        liveBeat = setInterval(touchLive, 30000);
        // Fallback poll if SSE unavailable.
        if (typeof EventSource === 'undefined') {
          liveTimer = setInterval(swapFlights, LIVE_MS);
        }
      }
      syncViewURL();
    }

    liveBtn.addEventListener('click', () => {
      const on = liveBtn.getAttribute('aria-pressed') !== 'true';
      setLive(on);
    });

    function onViewChange() {
      applyListFilter();
      syncViewURL();
    }

    [filterQ, filterAirborne, filterAlt, filterEpwr, filterAirline, sortBy, followSel, alertApproach].forEach((el) => {
      if (!el) return;
      el.addEventListener('input', onViewChange);
      el.addEventListener('change', onViewChange);
    });
    sortBy.addEventListener('change', () => {
      try { localStorage.setItem('wroclaw-sky-sort', sortBy.value); } catch (_) {}
    });
    if (alertApproach) {
      alertApproach.addEventListener('change', async () => {
        if (!alertApproach.checked) return;
        if (typeof Notification === 'undefined') return;
        try {
          if (Notification.permission === 'default') await Notification.requestPermission();
        } catch (_) {}
      });
    }

    document.body.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail && e.detail.target && e.detail.target.id === 'flights') {
        refreshMap();
      }
    });

    // URL query wins; otherwise restore sort/live from localStorage.
    const hasURLView = {{ if or .View.Q .View.Airborne (ne .View.Alt "any") (ne .View.EPWR "any") (ne .View.Sort "callsign") .View.Airline .View.Live (not .View.Follow) .View.Alert .View.ICAO }}true{{ else }}false{{ end }};
    if (!hasURLView) {
      try {
        const savedSort = localStorage.getItem('wroclaw-sky-sort');
        if (savedSort && sortBy.querySelector('option[value="' + savedSort + '"]')) {
          sortBy.value = savedSort;
        }
      } catch (_) {}
    }
    applyListFilter();
    syncViewURL();
    (async () => {
      const wantLive = bootLive || (!hasURLView && (() => {
        try { return localStorage.getItem('wroclaw-sky-live') === '1'; } catch (_) { return false; }
      })());
      if (wantLive) await setLive(true);
      await refreshMap();
      if (bootIcao) await window.showAircraftDetail(bootIcao);
    })();
  </script>
</body>
</html>
